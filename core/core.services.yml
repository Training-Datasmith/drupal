parameters:
  # The app.root and site.path parameters are dynamically set by
  # \Drupal\Core\Drupal_Kernel::initializeContainer(). They are listed here to
  # allow IDEs to autocomplete them when writing new service YAML files.
  app.root: ''
  site.path: ''
  # \Drupal\Core\Cache\List_Cache_Bins_Pass::process() will override this but defining this allows the cache system to
  # function properly before that runs.
  cache_default_bin_backends: []
  memory_cache_default_bin_backends: []
  entity.memory_cache.slots: 1000
  security.enable_super_user: true
  core.moved_classes:
    'Drupal\Core\String_Translation\Translation_Wrapper':
      class: 'Drupal\Core\String_Translation\Translatable_Markup'
    'Doctrine\Common\Annotations\Annotation_Exception':
      class: 'Drupal\Component\Annotation\Doctrine\Annotation_Exception'
      deprecation_version: drupal:11.3.0
      removed_version: drupal:12.0.0
      change_record: https://www.drupal.org/node/3551049
  session.storage.options:
    gc_probability: 1
    gc_divisor: 100
    gc_maxlifetime: 200000
    cookie_lifetime: 2000000
    cookie_samesite: Lax
    name_suffix: ''
  twig.config:
    debug: false
    auto_reload: null
    cache: true
    use_yield: true
    allowed_file_extensions:
      - css
      - html
      - js
      - svg
      - twig
  renderer.config:
    required_cache_contexts: ['languages:language_interface', 'theme', 'user.permissions']
    auto_placeholder_conditions:
      max-age: 0
      contexts: ['session', 'user']
      tags: []
    debug: false
  factory.keyvalue:
    default: keyvalue.database
  http.response.debug_cacheability_headers: false
  factory.keyvalue.expirable:
    default: keyvalue.expirable.database
  filter_protocols:
    - http
    - https
    - ftp
    - news
    - nntp
    - tel
    - telnet
    - mailto
    - irc
    - ssh
    - sftp
    - webcal
    - rtsp
  cors.config:
    enabled: false
    allowedHeaders: []
    allowedMethods: []
    allowedOrigins: ['*']
    exposedHeaders: false
    maxAge: false
    supportsCredentials: false
  tempstore.expire: 604800
  queue.config:
    suspendMaximumWait: 30.0
  stream_wrapper.allowed_file_extensions:
    module:
      - json
    theme:
      - json
services:
  _defaults:
    autoconfigure: true
  plugin.manager.config_action:
    class: Drupal\Core\Config\Action\Config_Action_Manager
    parent: default_plugin_manager
    arguments: ['@config.manager', '@config.storage', '@config.typed', '@config.factory']
  Drupal\Core\Default_Content\Importer:
    autowire: true
  Drupal\Core\Default_Content\Exporter:
    autowire: true
    calls:
      - [setLogger, ['@logger.channel.default_content']]
  Drupal\Core\Default_Content\Admin_Account_Switcher:
    arguments:
      $isSuperUserAccessEnabled: '%security.enable_super_user%'
    autowire: true
    public: false
  # Simple cache contexts, directly derived from the request context.
  cache_context.ip:
    class: Drupal\Core\Cache\Context\Ip_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.protocol_version:
    class: Drupal\Core\Cache\Context\Protocol_Version_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.headers:
    class: Drupal\Core\Cache\Context\Headers_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.cookies:
    class: Drupal\Core\Cache\Context\Cookies_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.session:
    class: Drupal\Core\Cache\Context\Session_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context}
  cache_context.session.exists:
    class: Drupal\Core\Cache\Context\Session_Exists_Cache_Context
    arguments: ['@session_configuration', '@request_stack']
    tags:
      - { name: cache.context}
  cache_context.request_format:
    class: Drupal\Core\Cache\Context\Request_Format_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.url:
    class: Drupal\Core\Cache\Context\Url_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.url.site:
    class: Drupal\Core\Cache\Context\Site_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.url.path:
    class: Drupal\Core\Cache\Context\Path_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.url.path.parent:
    class: Drupal\Core\Cache\Context\Path_Parent_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.url.path.is_front:
    class: Drupal\Core\Cache\Context\Is_Front_Path_Cache_Context
    arguments: ['@path.matcher']
    tags:
      - { name: cache.context }
  cache_context.url.query_args:
    class: Drupal\Core\Cache\Context\Query_Args_Cache_Context
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.url.query_args.pagers:
    class: Drupal\Core\Cache\Context\Pagers_Cache_Context
    arguments: ['@pager.parameters']
    tags:
      - { name: cache.context }

  # Complex cache contexts, that depend on the routing system.
  cache_context.route:
    class: Drupal\Core\Cache\Context\Route_Cache_Context
    arguments: ['@current_route_match']
    tags:
      - { name: cache.context }
  cache_context.route.name:
    class: Drupal\Core\Cache\Context\Route_Name_Cache_Context
    arguments: ['@current_route_match']
    tags:
      - { name: cache.context }
  cache_context.route.menu_active_trails:
    class: Drupal\Core\Cache\Context\Menu_Active_Trails_Cache_Context
    arguments: ['@menu.active_trail']
    tags:
      - { name: cache.context }

  # Complex cache contexts, that may be calculated from a combination of
  # multiple aspects of the request context plus additional logic. Hence they
  # are their own roots.
  cache_context.user:
    class: Drupal\Core\Cache\Context\User_Cache_Context
    arguments: ['@current_user']
    tags:
      - { name: cache.context}
  cache_context.user.permissions:
    class: Drupal\Core\Cache\Context\Account_Permissions_Cache_Context
    arguments: ['@current_user', '@user_permissions_hash_generator']
    tags:
      - { name: cache.context}
  cache_context.user.roles:
    class: Drupal\Core\Cache\Context\User_Roles_Cache_Context
    arguments: ['@current_user']
    tags:
      - { name: cache.context}
  cache_context.user.is_super_user:
    class: Drupal\Core\Cache\Context\Is_Super_User_Cache_Context
    arguments: ['@current_user']
    tags:
      - { name: cache.context}
  cache_context.languages:
    class: Drupal\Core\Cache\Context\Languages_Cache_Context
    arguments: ['@language_manager']
    tags:
      - { name: cache.context}
  cache_context.theme:
    class: Drupal\Core\Cache\Context\Theme_Cache_Context
    arguments: ['@theme.manager']
    tags:
      - { name: cache.context}
  cache_context.timezone:
    class: Drupal\Core\Cache\Context\Time_Zone_Cache_Context
    tags:
      - { name: cache.context}

  cache_factory:
    class: Drupal\Core\Cache\Cache_Factory
    arguments: ['@settings', '%cache_default_bin_backends%', '%memory_cache_default_bin_backends%']
    calls:
      - [setContainer, ['@service_container']]
  Drupal\Core\Cache\Cache_Factory_Interface: '@cache_factory'
  variation_cache_factory:
    class: Drupal\Core\Cache\Variation_Cache_Factory
    arguments: ['@request_stack', '@cache_factory', '@cache_contexts_manager']
  Drupal\Core\Cache\Variation_Cache_Factory: '@variation_cache_factory'
  cache_contexts_manager:
    class: Drupal\Core\Cache\Context\Cache_Contexts_Manager
    arguments: ['@service_container', '%cache_contexts%' ]
  Drupal\Core\Cache\Context\Cache_Contexts_Manager: '@cache_contexts_manager'
  cache_tags.invalidator:
    class: Drupal\Core\Cache\Cache_Tags_Invalidator
    tags:
      - { name: service_collector, call: addInvalidator, tag: cache_tags_invalidator }
      - { name: service_collector, call: addBin, tag: cache.bin }
      - { name: service_collector, call: addBin, tag: cache.bin.memory }
  Drupal\Core\Cache\Cache_Tags_Invalidator_Interface: '@cache_tags.invalidator'
  cache_tags.invalidator.checksum:
    class: Drupal\Core\Cache\Database_Cache_Tags_Checksum
    arguments: ['@database']
    tags:
      - { name: cache_tags_invalidator}
      - { name: backend_overridable }
  Drupal\Core\Cache\Cache_Tags_Checksum_Interface: '@cache_tags.invalidator.checksum'
  cache_tags.preloader:
    class: Drupal\Core\Cache\Event_Subscriber\Cache_Tag_Preload_Subscriber
    autowire: true
  cache.backend.chainedfast:
    class: Drupal\Core\Cache\Chained_Fast_Backend_Factory
    arguments: ['@settings']
    calls:
      - [setContainer, ['@service_container']]
  cache.backend.database:
    class: Drupal\Core\Cache\Database_Backend_Factory
    arguments: ['@database', '@cache_tags.invalidator.checksum', '@settings', '@serialization.phpserialize', '@datetime.time']
    tags:
      - { name: backend_overridable }
  cache.backend.apcu:
    class: Drupal\Core\Cache\Apcu_Backend_Factory
    arguments: ['%app.root%', '%site.path%', '@cache_tags.invalidator.checksum', '@datetime.time']
  cache.backend.php:
    class: Drupal\Core\Cache\Php_Backend_Factory
    arguments: ['@cache_tags.invalidator.checksum', '@datetime.time']
  cache.backend.memory:
    class: Drupal\Core\Cache\Memory_Backend_Factory
    arguments: ['@datetime.time']
    deprecated: 'The "%service_id%" service is deprecated in drupal:11.3.0 and is removed from drupal:13.0.0. Use cache.backend.memory.memory instead. See https://www.drupal.org/node/3546856'
  cache.backend.memory.memory:
    class: Drupal\Core\Cache\Memory_Cache\Memory_Cache_Factory
    arguments: ['@datetime.time']
  # A special cache bin that does not persist beyond the length of the request.
  cache.static:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin, default_backend: cache.backend.memory }
    deprecated: 'The "%service_id%" service is deprecated in drupal:11.3.0 and is removed from drupal:13.0.0. Use the cache.memory bin instead. See https://www.drupal.org/node/3546856'
    factory: ['@cache_factory', 'get']
    arguments: [static]
  cache.bootstrap:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin, default_backend: cache.backend.chainedfast }
    factory: ['@cache_factory', 'get']
    arguments: [bootstrap]
  cache.config:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin, default_backend: cache.backend.chainedfast }
    factory: ['@cache_factory', 'get']
    arguments: [config]
  cache.default:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [default]
  cache.entity:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [entity]
  cache.menu:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [menu]
  cache.render:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [render]
  cache.access_policy:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [access_policy]
  cache.access_policy_memory:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin.memory, default_backend: cache.backend.memory.memory }
    factory: ['@cache_factory', 'get']
    arguments: [access_policy_memory]
  cache.data:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [data]
  cache.discovery:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin, default_backend: cache.backend.chainedfast }
    factory: ['@cache_factory', 'get']
    arguments: [discovery]
  cache.memory:
    class: Drupal\Core\Cache\Memory_Cache\Memory_Cache_Interface
    tags:
      - { name: cache.bin.memory, default_backend: cache.backend.memory.memory }
    factory: ['@cache_factory', 'get']
    arguments: [memory]
  cache_prewarmer:
    class: Drupal\Core\Pre_Warm\Cache_Pre_Warmer
    arguments: ['@class_resolver']
    tags:
      - { name: service_id_collector, tag: cache_prewarmable }
  Drupal\Core\Pre_Warm\Cache_Pre_Warmer_Interface: '@cache_prewarmer'
  variation_cache.access_policy:
    class: Drupal\Core\Cache\Variation_Cache_Interface
    factory: ['@variation_cache_factory', 'get']
    arguments: [access_policy]
  variation_cache.access_policy_memory:
    class: Drupal\Core\Cache\Variation_Cache_Interface
    factory: ['@variation_cache_factory', 'get']
    arguments: [access_policy_memory]
  Drupal\Core\Asset\Asset_Query_String_Interface: '@asset.query_string'
  asset.query_string:
    class: Drupal\Core\Asset\Asset_Query_String
    arguments:
      - '@state'
      - '@datetime.time'
  cache_router_rebuild_subscriber:
    class: Drupal\Core\Event_Subscriber\Cache_Router_Rebuild_Subscriber
  page_cache_request_policy:
    class: Drupal\Core\Page_Cache\Default_Request_Policy
    arguments: ['@session_configuration']
    tags:
      - { name: service_collector, tag: page_cache_request_policy, call: addPolicy}
  Drupal\Core\Page_Cache\Request_Policy_Interface: '@page_cache_request_policy'
  page_cache_response_policy:
    class: Drupal\Core\Page_Cache\Chain_Response_Policy
    tags:
      - { name: service_collector, tag: page_cache_response_policy, call: addPolicy}
    lazy: true
  Drupal\Core\Page_Cache\Response_Policy_Interface: '@page_cache_response_policy'
  page_cache_kill_switch:
    class: Drupal\Core\Page_Cache\Response_Policy\Kill_Switch
    tags:
      - { name: page_cache_response_policy }
      - { name: dynamic_page_cache_response_policy }
  Drupal\Core\Page_Cache\Response_Policy\Kill_Switch: '@page_cache_kill_switch'
  page_cache_no_cache_routes:
    class: Drupal\Core\Page_Cache\Response_Policy\Deny_No_Cache_Routes
    arguments: ['@current_route_match']
    public: false
    tags:
      - { name: page_cache_response_policy }
      - { name: dynamic_page_cache_response_policy }
  page_cache_no_server_error:
    class: Drupal\Core\Page_Cache\Response_Policy\No_Server_Error
    public: false
    tags:
      - { name: page_cache_response_policy }
      - { name: dynamic_page_cache_response_policy }
  config.manager:
    class: Drupal\Core\Config\Config_Manager
    arguments: ['@entity_type.manager', '@config.factory', '@config.typed', '@string_translation', '@config.storage', '@event_dispatcher', '@entity.repository', '@extension.path.resolver']
  Drupal\Core\Config\Config_Manager_Interface: '@config.manager'
  config.factory:
    class: Drupal\Core\Config\Config_Factory
    tags:
      - { name: service_collector, tag: 'config.factory.override', call: addOverride }
    arguments: ['@config.storage', '@event_dispatcher', '@config.typed']
  Drupal\Core\Config\Config_Factory_Interface: '@config.factory'
  Drupal\Core\Config\Config_Importer_Factory:
    autowire: true
  config.importer_subscriber:
    class: Drupal\Core\Config\Importer\Final_Missing_Content_Subscriber
  config.installer:
    class: Drupal\Core\Config\Config_Installer
    arguments: ['@config.factory', '@config.storage', '@config.typed', '@config.manager', '@event_dispatcher', '%install_profile%', '@extension.path.resolver']
  Drupal\Core\Config\Config_Installer_Interface: '@config.installer'
  config.storage:
    class: Drupal\Core\Config\Cached_Storage
    arguments: ['@config.storage.active', '@cache.config']
  Drupal\Core\Config\Storage_Cache_Interface: '@config.storage'
  config.storage.active:
    class: Drupal\Core\Config\Database_Storage
    arguments: ['@database', 'config']
    public: false
    tags:
      - { name: backend_overridable }
  config.storage.checkpoint:
    class: Drupal\Core\Config\Checkpoint\Checkpoint_Storage
    arguments: [ '@config.storage', '@config.checkpoints', '@keyvalue' ]
  Drupal\Core\Config\Checkpoint\Checkpoint_Storage_Interface: '@config.storage.checkpoint'
  config.checkpoints:
    class: Drupal\Core\Config\Checkpoint\Linear_History
    arguments: [ '@state', '@datetime.time' ]
  Drupal\Core\Config\Checkpoint\Checkpoint_List_Interface: '@config.checkpoints'
  config.import_transformer:
    class: Drupal\Core\Config\Import_Storage_Transformer
    arguments: ['@event_dispatcher', '@database', '@lock', '@lock.persistent']
  Drupal\Core\Config\Import_Storage_Transformer: '@config.import_transformer'
  config.storage.export:
    class: Drupal\Core\Config\Managed_Storage
    arguments: ['@config.storage.export.manager']
  config.storage.export.manager:
    class: Drupal\Core\Config\Export_Storage_Manager
    arguments: ['@config.storage', '@database', '@event_dispatcher', '@lock']
    public: false
  Drupal\Core\Config\Storage_Manager_Interface: '@config.storage.export.manager'
  config.storage.sync:
    class: Drupal\Core\Config\File_Storage
    factory: Drupal\Core\Config\File_Storage_Factory::getSync
  config.storage.snapshot:
    class: Drupal\Core\Config\Database_Storage
    arguments: ['@database', config_snapshot]
    tags:
      - { name: backend_overridable }
  config.storage.schema:
    class: Drupal\Core\Config\Extension_Install_Storage
    arguments: ['@config.storage', 'config/schema', '', true, '%install_profile%']
  config.typed:
    class: Drupal\Core\Config\Typed_Config_Manager
    arguments: ['@config.storage', '@config.storage.schema', '@cache.discovery', '@module_handler', '@class_resolver']
    tags:
      - { name: plugin_manager_cache_clear }
    calls:
      - [setValidationConstraintManager, ['@validation.constraint']]
  Drupal\Core\Config\Typed_Config_Manager_Interface: '@config.typed'
  context.handler:
    class: Drupal\Core\Plugin\Context\Context_Handler
  Drupal\Core\Plugin\Context\Context_Handler_Interface: '@context.handler'
  context.repository:
    class: Drupal\Core\Plugin\Context\Lazy_Context_Repository
    arguments: ['@service_container']
    tags:
      - { name: service_id_collector, tag: context_provider }
  Drupal\Core\Plugin\Context\Context_Repository_Interface: '@context.repository'
  Drupal\Component\Dependency_Injection\Reverse_Container:
    arguments: [ '@service_container' ]
  cron:
    class: Drupal\Core\Cron
    arguments: ['@module_handler', '@lock', '@queue', '@state', '@account_switcher', '@logger.channel.cron', '@plugin.manager.queue_worker', '@datetime.time', '%queue.config%']
  Drupal\Core\Cron_Interface: '@cron'
  diff.formatter:
    class: Drupal\Core\Diff\Diff_Formatter
    arguments: ['@config.factory']
  Drupal\Core\Diff\Diff_Formatter: '@diff.formatter'
  database:
    class: Drupal\Core\Database\Connection
    factory: Drupal\Core\Database\Database::getConnection
    arguments: [default]
  Drupal\Core\Database\Connection: '@database'
  database.replica:
    class: Drupal\Core\Database\Connection
    factory: Drupal\Core\Database\Database::getConnection
    arguments: [replica]
  database.replica_kill_switch:
    class: Drupal\Core\Database\Replica_Kill_Switch
    arguments: ['@settings', '@datetime.time', '@session']
  Drupal\Core\Database\Replica_Kill_Switch: '@database.replica_kill_switch'
  Drupal\Core\Database\Event_Subscriber\Statement_Execution_Subscriber: ~
  datetime.time:
    class: Drupal\Component\Datetime\Time
    arguments: ['@request_stack']
  Drupal\Component\Datetime\Time_Interface: '@datetime.time'
  file_system:
    class: Drupal\Core\File\File_System
    arguments: ['@stream_wrapper_manager', '@settings']
  Drupal\Core\File\File_System_Interface: '@file_system'
  file_url_generator:
    class: Drupal\Core\File\File_Url_Generator
    arguments: ['@stream_wrapper_manager', '@request_stack', '@module_handler']
  Drupal\Core\File\File_Url_Generator_Interface: '@file_url_generator'
  form_builder:
    class: Drupal\Core\Form\Form_Builder
    arguments: ['@form_validator', '@form_submitter', '@form_cache', '@module_handler', '@event_dispatcher', '@request_stack', '@class_resolver', '@element_info', '@theme.manager', '@csrf_token', '@callable_resolver']
  Drupal\Core\Form\Form_Builder_Interface: '@form_builder'
  form_validator:
    class: Drupal\Core\Form\Form_Validator
    arguments: ['@request_stack', '@string_translation', '@csrf_token', '@logger.channel.form', '@form_error_handler', '@callable_resolver']
  Drupal\Core\Form\Form_Validator_Interface: '@form_validator'
  form_submitter:
    class: Drupal\Core\Form\Form_Submitter
    arguments: ['@request_stack', '@url_generator', '@redirect_response_subscriber', '@callable_resolver']
  Drupal\Core\Form\Form_Submitter_Interface: '@form_submitter'
  form_error_handler:
    class: Drupal\Core\Form\Form_Error_Handler
  Drupal\Core\Form\Form_Error_Handler_Interface: '@form_error_handler'
  form_cache:
    class: Drupal\Core\Form\Form_Cache
    arguments: ['%app.root%', '@keyvalue.expirable', '@module_handler', '@current_user', '@csrf_token', '@logger.channel.form', '@request_stack', '@page_cache_request_policy']
    public: false  # Private to form_builder
  Drupal\Core\Form\Form_Cache_Interface: '@form_cache'
  Drupal\Core\Form\Form_Preprocess:
    class: Drupal\Core\Form\Form_Preprocess
  keyvalue:
    class: Drupal\Core\Key_Value_Store\Key_Value_Factory
    arguments: ['@service_container', '%factory.keyvalue%']
  Drupal\Core\Key_Value_Store\Key_Value_Factory_Interface: '@keyvalue'
  keyvalue.database:
    class: Drupal\Core\Key_Value_Store\Key_Value_Database_Factory
    arguments: ['@serialization.phpserialize', '@database']
  keyvalue.expirable:
    class: Drupal\Core\Key_Value_Store\Key_Value_Expirable_Factory
    arguments: ['@service_container', '%factory.keyvalue.expirable%']
  Drupal\Core\Key_Value_Store\Key_Value_Expirable_Factory_Interface: '@keyvalue.expirable'
  keyvalue.expirable.database:
    class: Drupal\Core\Key_Value_Store\Key_Value_Database_Expirable_Factory
    arguments: ['@serialization.phpserialize', '@database', '@datetime.time']
  logger.factory:
    class: Drupal\Core\Logger\Logger_Channel_Factory
    arguments: ['@request_stack', '@current_user']
    tags:
      - { name: service_collector, tag: logger, call: addLogger }
  Drupal\Core\Logger\Logger_Channel_Factory_Interface: '@logger.factory'
  logger.channel_base:
    abstract: true
    class: Drupal\Core\Logger\Logger_Channel
    factory: ['@logger.factory', 'get']
  logger.channel.default:
    parent: logger.channel_base
    arguments: ['system']
  logger.channel.default_content:
    parent: logger.channel_base
    arguments: ['default_content']
  logger.channel.php:
    parent: logger.channel_base
    arguments: ['php']
  logger.channel.image:
    parent: logger.channel_base
    arguments: ['image']
  logger.channel.cron:
    parent: logger.channel_base
    arguments: ['cron']
  logger.channel.file:
    class: Drupal\Core\Logger\Logger_Channel
    factory: ['@logger.factory', 'get']
    arguments: ['file']
  logger.channel.form:
    parent: logger.channel_base
    arguments: ['form']
  logger.channel.security:
    parent: logger.channel_base
    arguments: ['security']
  logger.channel.mail:
    parent: logger.channel_base
    arguments: ['mail']
  logger.channel.menu:
    parent: logger.channel_base
    arguments: ['menu']
  logger.channel.router:
    parent: logger.channel_base
    arguments: ['router']
