    class: Symfony\Component\Http_Kernel\Http_Kernel
    # A NULL value is passed to the request stack because Drupal populates the
    # request stack before HttpKernel::handle() calls push() and needs the
    # request stack to work after it calls pop(). This also prevents both
    # Drupal and Symfony pushing the same request to the request_stack service
    # twice and only popping the request once. The Symfony HTTP kernel creates
    # an internal request stack and pushes and pops request objects to that
    # instead of Drupal's request stack. Note that the request objects are the
    # same, so any changes to the request object will be reflected.
    #
    # Drupal pushes to the request stack in DrupalKernel::preHandle(), called
    # from KernelPreHandle::handle(). Drupal pops main requests in
    # DrupalKernel::terminate() and sub requests in KernelPreHandle::handle().
