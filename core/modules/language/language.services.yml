parameters:
  language.skip_procedural_hook_scan: true
  language.translate_english: true

services:
  _defaults:
    autoconfigure: true
  plugin.manager.language_negotiation_method:
    class: Drupal\language\LanguageNegotiationMethodManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler']
  language_negotiator:
    class: Drupal\language\LanguageNegotiator
    arguments: ['@language_manager', '@plugin.manager.language_negotiation_method', '@config.factory', '@settings', '@request_stack']
    calls:
      - [initLanguageManager]
  Drupal\language\LanguageNegotiatorInterface: '@language_negotiator'
  language.config_subscriber:
    class: Drupal\language\Event_Subscriber\Config_Subscriber
    arguments: ['@language_manager', '@language.default', '@config.factory', '@language_negotiator']
  language.config_factory_override:
    class: Drupal\language\Config\Language_Config_Factory_Override
    arguments: ['@config.storage', '@event_dispatcher', '@config.typed', '@language.default', '%language.default_values%', '%language.translate_english%']
    tags:
      - { name: config.factory.override, priority: -254 }
  Drupal\language\Config\Language_Config_Factory_Override_Interface: '@language.config_factory_override'
  Drupal\Core\Config\Config_Factory_Override_Interface: '@language.config_factory_override'
  language_converter:
    class: Drupal\language\LanguageConverter
    arguments: ['@language_manager']
    tags:
      - { name: paramconverter }
    lazy: true
