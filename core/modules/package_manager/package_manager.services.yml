parameters:
  package_manager.skip_procedural_hook_scan: true

services:
  _defaults:
    autoconfigure: true
    autowire: true

  # Underlying Symfony utilities for Composer Stager.
  Symfony\Component\Filesystem\Filesystem:
    public: false
  Symfony\Component\Process\Executable_Finder:
    public: false

  # Basic infrastructure services for Composer Stager, overridden by us to
  # provide additional functionality.
  Drupal\package_manager\ExecutableFinder:
    public: false
    calls:
      - [setLogger, ['@logger.channel.package_manager']]
    decorates: 'Php_Tuf\Composer_Stager\API\Finder\Service\Executable_Finder_Interface'
  Drupal\package_manager\TranslatableStringFactory:
    public: false
    decorates: 'Php_Tuf\Composer_Stager\API\Translation\Factory\Translatable_Factory_Interface'
  Drupal\package_manager\LoggingBeginner:
    public: false
    decorates: 'Php_Tuf\Composer_Stager\API\Core\Beginner_Interface'
  Drupal\package_manager\LoggingStager:
    public: false
    decorates: 'Php_Tuf\Composer_Stager\API\Core\Stager_Interface'
  Drupal\package_manager\LoggingCommitter:
    public: false
    decorates: 'Php_Tuf\Composer_Stager\API\Core\Committer_Interface'
  logger.channel.package_manager:
    parent: logger.channel_base
    arguments:
      - 'package_manager'
  logger.channel.package_manager_change_log:
    parent: logger.channel_base
    arguments:
      - 'package_manager_change_log'

  # Services provided to Drupal by Package Manager.
  Drupal\package_manager\PathLocator:
    arguments:
      $appRoot: '%app.root%'
  Drupal\package_manager\FailureMarker: {}
  Drupal\package_manager\Event_Subscriber\Update_Data_Subscriber: {}
  Drupal\package_manager\Event_Subscriber\Change_Logger:
    calls:
      - [setLogger, ['@logger.channel.package_manager_change_log']]
  Drupal\package_manager\Event_Subscriber\Direct_Write_Subscriber: {}
  Drupal\package_manager\ComposerInspector: {}

  # Validators.
  Drupal\package_manager\Validator\Environment_Support_Validator: {}
  Drupal\package_manager\Validator\Composer_Validator: {}
  Drupal\package_manager\Validator\Disk_Space_Validator: {}
  Drupal\package_manager\Validator\Pending_Updates_Validator:
    arguments:
      - '%app.root%'
      - '@update.post_update_registry'
    autowire: false
  Drupal\package_manager\Validator\Lock_File_Validator:
    arguments:
      $keyValueFactory: '@keyvalue'
  Drupal\package_manager\Validator\Writable_File_System_Validator: {}
  Drupal\package_manager\Validator\Composer_Minimum_Stability_Validator: {}
  Drupal\package_manager\Validator\Multisite_Validator: {}
  Drupal\package_manager\Validator\Symlink_Validator: {}
  Drupal\package_manager\Validator\Duplicate_Info_File_Validator: {}
  Drupal\package_manager\Validator\Enabled_Extensions_Validator: {}
  Drupal\package_manager\Validator\Overwrite_Existing_Packages_Validator: {}
  Drupal\package_manager\Validator\Allowed_Scaffold_Packages_Validator: {}
  Drupal\package_manager\Validator\Sandbox_Database_Updates_Validator: {}
  Drupal\package_manager\Path_Excluder\Test_Site_Excluder: {}
  Drupal\package_manager\Path_Excluder\Vendor_Hardening_Excluder: {}
  Drupal\package_manager\Path_Excluder\Site_Files_Excluder:
    arguments:
      $wrappers: [public, private, assets]
  Drupal\package_manager\Path_Excluder\Sqlite_Database_Excluder: {}
  Drupal\package_manager\Path_Excluder\Git_Excluder: {}
  Drupal\package_manager\Path_Excluder\Unknown_Path_Excluder: {}
  Drupal\package_manager\Path_Excluder\Site_Configuration_Excluder:
    arguments:
      $sitePath: '%site.path%'
  Drupal\package_manager\Path_Excluder\Node_Modules_Excluder: {}
  Drupal\package_manager\PackageManagerUninstallValidator:
    arguments:
      $eventDispatcher: '@event_dispatcher'
  Drupal\package_manager\Validator\Settings_Validator: {}
  Drupal\package_manager\Validator\Rsync_Validator: {}
  Drupal\package_manager\Validator\Composer_Plugins_Validator: {}
  Drupal\package_manager\Validator\Composer_Patches_Validator: {}
  Drupal\package_manager\Validator\Base_Requirements_Fulfilled_Validator: {}
  Drupal\package_manager\Validator\Supported_Release_Validator: {}
  Drupal\package_manager\Validator\Sandbox_Directory_Validator: {}
  Drupal\package_manager\Validator\Php_Extensions_Validator: {}
  Drupal\package_manager\Validator\Php_Tuf_Validator:
    arguments:
      $repositories:
        - 'https://packages.drupal.org/8'
  Drupal\package_manager\PackageManagerUpdateProcessor:
    arguments:
      # @todo Autowire $update_fetcher when https://drupal.org/i/3325557 lands.
      $update_fetcher: '@update.fetcher'
      $key_value_factory: '@keyvalue'
      $key_value_expirable_factory: '@keyvalue.expirable'

  # Services from php-tuf/composer-stager package.
  Php_Tuf\Composer_Stager\API\Core\Beginner_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Core\Beginner
  Php_Tuf\Composer_Stager\API\Core\Cleaner_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Core\Cleaner
  Php_Tuf\Composer_Stager\API\Core\Committer_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Core\Committer
  Php_Tuf\Composer_Stager\API\Core\Stager_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Core\Stager
  Php_Tuf\Composer_Stager\API\Environment\Service\Environment_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Environment\Service\Environment
  Php_Tuf\Composer_Stager\API\File_Syncer\Service\File_Syncer_Interface:
    class: Php_Tuf\Composer_Stager\Internal\File_Syncer\Service\File_Syncer
  Php_Tuf\Composer_Stager\API\Filesystem\Service\Filesystem_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Filesystem\Service\Filesystem
  Php_Tuf\Composer_Stager\API\Finder\Service\Executable_Finder_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Finder\Service\Executable_Finder
  Php_Tuf\Composer_Stager\API\Finder\Service\File_Finder_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Finder\Service\File_Finder
  Php_Tuf\Composer_Stager\API\Path\Factory\Path_Factory_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Path\Factory\Path_Factory
  Php_Tuf\Composer_Stager\API\Path\Factory\Path_List_Factory_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Path\Factory\Path_List_Factory
  Php_Tuf\Composer_Stager\API\Precondition\Service\Active_And_Staging_Dirs_Are_Different_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Active_And_Staging_Dirs_Are_Different
  Php_Tuf\Composer_Stager\API\Precondition\Service\Active_Dir_Exists_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Active_Dir_Exists
  Php_Tuf\Composer_Stager\API\Precondition\Service\Active_Dir_Is_Ready_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Active_Dir_Is_Ready
  Php_Tuf\Composer_Stager\API\Precondition\Service\Active_Dir_Is_Writable_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Active_Dir_Is_Writable
  Php_Tuf\Composer_Stager\API\Precondition\Service\Beginner_Preconditions_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Beginner_Preconditions
  Php_Tuf\Composer_Stager\API\Precondition\Service\Cleaner_Preconditions_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Cleaner_Preconditions
  Php_Tuf\Composer_Stager\API\Precondition\Service\Committer_Preconditions_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Committer_Preconditions
  Php_Tuf\Composer_Stager\API\Precondition\Service\Common_Preconditions_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Common_Preconditions
  Php_Tuf\Composer_Stager\API\Precondition\Service\Composer_Is_Available_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Composer_Is_Available
  Php_Tuf\Composer_Stager\API\Precondition\Service\Host_Supports_Running_Processes_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Host_Supports_Running_Processes
  Php_Tuf\Composer_Stager\API\Precondition\Service\No_Absolute_Symlinks_Exist_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\No_Absolute_Symlinks_Exist
  Php_Tuf\Composer_Stager\API\Precondition\Service\No_Hard_Links_Exist_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\No_Hard_Links_Exist
  Php_Tuf\Composer_Stager\API\Precondition\Service\No_Links_Exist_On_Windows_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\No_Links_Exist_On_Windows
  Php_Tuf\Composer_Stager\API\Precondition\Service\No_Nesting_On_Windows_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\No_Nesting_On_Windows
  Php_Tuf\Composer_Stager\API\Precondition\Service\No_Symlinks_Point_Outside_The_Codebase_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\No_Symlinks_Point_Outside_The_Codebase
  Php_Tuf\Composer_Stager\API\Precondition\Service\No_Unsupported_Links_Exist_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\No_Unsupported_Links_Exist
  Php_Tuf\Composer_Stager\API\Precondition\Service\Rsync_Is_Available_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Rsync_Is_Available
  Php_Tuf\Composer_Stager\API\Precondition\Service\Stager_Preconditions_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Stager_Preconditions
  Php_Tuf\Composer_Stager\API\Precondition\Service\Staging_Dir_Does_Not_Exist_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Staging_Dir_Does_Not_Exist
  Php_Tuf\Composer_Stager\API\Precondition\Service\Staging_Dir_Exists_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Staging_Dir_Exists
  Php_Tuf\Composer_Stager\API\Precondition\Service\Staging_Dir_Is_Ready_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Staging_Dir_Is_Ready
  Php_Tuf\Composer_Stager\API\Precondition\Service\Staging_Dir_Is_Writable_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Precondition\Service\Staging_Dir_Is_Writable
  Php_Tuf\Composer_Stager\API\Process\Factory\Process_Factory_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Process\Factory\Process_Factory
  Php_Tuf\Composer_Stager\API\Process\Service\Composer_Process_Runner_Interface:
    class: Drupal\package_manager\ComposerRunner
  Php_Tuf\Composer_Stager\API\Process\Service\Output_Callback_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Process\Service\Output_Callback
  Php_Tuf\Composer_Stager\API\Process\Service\Process_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Process\Service\Process
  Php_Tuf\Composer_Stager\API\Process\Service\Rsync_Process_Runner_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Process\Service\Rsync_Process_Runner
  Php_Tuf\Composer_Stager\API\Translation\Factory\Translatable_Factory_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Translation\Factory\Translatable_Factory
  Php_Tuf\Composer_Stager\API\Translation\Service\Domain_Options_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Translation\Service\Domain_Options
  Php_Tuf\Composer_Stager\API\Translation\Service\Locale_Options_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Translation\Service\Locale_Options
  Php_Tuf\Composer_Stager\API\Translation\Service\Translator_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Translation\Service\Translator
  Php_Tuf\Composer_Stager\Internal\Path\Service\Path_Helper_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Path\Service\Path_Helper
    public: false
  Php_Tuf\Composer_Stager\Internal\Process\Factory\Symfony_Process_Factory_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Process\Factory\Symfony_Process_Factory
    public: false
  Php_Tuf\Composer_Stager\Internal\Process\Service\Output_Callback_Adapter_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Process\Service\Output_Callback_Adapter
    public: false
  Php_Tuf\Composer_Stager\Internal\Translation\Service\Symfony_Translator_Proxy_Interface:
    class: Php_Tuf\Composer_Stager\Internal\Translation\Service\Symfony_Translator_Proxy
    public: false

  package_manager.direct_write_precondition.directories:
    class: Drupal\package_manager\DirectWritePreconditionBypass
    decorates: 'Php_Tuf\Composer_Stager\API\Precondition\Service\Active_And_Staging_Dirs_Are_Different_Interface'
    arguments:
      - '@.inner'
    public: false
  package_manager.direct_write_precondition.rsync:
    class: Drupal\package_manager\DirectWritePreconditionBypass
    decorates: 'Php_Tuf\Composer_Stager\API\Precondition\Service\Rsync_Is_Available_Interface'
    arguments:
      - '@.inner'
    public: false
