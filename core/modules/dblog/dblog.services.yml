parameters:
  dblog.skip_procedural_hook_scan: true

services:
  _defaults:
    autoconfigure: true
  logger.dblog:
    class: Drupal\dblog\Logger\Db_Log
    arguments: ['@database', '@logger.log_message_parser']
    tags:
      - { name: logger }
      - { name: backend_overridable }
  Drupal\dblog\DbLogFilters:
    autowire: true
