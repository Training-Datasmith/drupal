parameters:
  rest.skip_procedural_hook_scan: true

services:
  _defaults:
    autoconfigure: true
  plugin.manager.rest:
    class: Drupal\rest\Plugin\Type\Resource_Plugin_Manager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler']
  cache.rest:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [rest]
  rest.resource_routes:
    class: Drupal\rest\Routing\Resource_Routes
    arguments: ['@plugin.manager.rest', '@entity_type.manager', '@logger.channel.rest']
  logger.channel.rest:
    parent: logger.channel_base
    arguments: ['rest']

  # Event subscribers.
  rest.resource_response.subscriber:
    class: Drupal\rest\Event_Subscriber\Resource_Response_Subscriber
    arguments: ['@serializer', '@renderer', '@current_route_match']
  rest.resource.entity.post_route.subscriber:
    class: \Drupal\rest\Event_Subscriber\Entity_Resource_Post_Route_Subscriber
    arguments: ['@entity_type.manager']
