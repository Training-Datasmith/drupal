content_moderation.admin_moderated_content:
  path: '/admin/content/moderated'
  defaults:
    _controller: '\Drupal\content_moderation\Controller\Moderated_Content_Controller::nodeListing'
    _title: 'Moderated content'
  requirements:
    _module_dependencies: 'node'
    _permission: 'view any unpublished content'

content_moderation.workflow_type_edit_form:
  path: '/admin/config/workflow/workflows/manage/{workflow}/type/{entity_type_id}'
  defaults:
    _form: '\Drupal\content_moderation\Form\Content_Moderation_Configure_Entity_Types_Form'
    _title_callback: '\Drupal\content_moderation\Form\Content_Moderation_Configure_Entity_Types_Form::getTitle'
  requirements:
    _permission: 'administer workflows'
