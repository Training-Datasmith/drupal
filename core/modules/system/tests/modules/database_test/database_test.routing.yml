database_test.pager_query_even:
  path: '/database_test/pager_query_even/{limit}'
  defaults:
    _controller: '\Drupal\database_test\Controller\Database_Test_Controller::pagerQueryEven'
  requirements:
    _access: 'TRUE'

database_test.pager_query_odd:
  path: '/database_test/pager_query_odd/{limit}'
  defaults:
    _controller: '\Drupal\database_test\Controller\Database_Test_Controller::pagerQueryOdd'
  requirements:
    _access: 'TRUE'

database_test.tablesort:
  path: '/database_test/tablesort'
  defaults:
    _controller: '\Drupal\database_test\Controller\Database_Test_Controller::testTablesort'
  requirements:
    _access: 'TRUE'

database_test.tablesort_first:
  path: '/database_test/tablesort_first'
  defaults:
    _controller: '\Drupal\database_test\Controller\Database_Test_Controller::testTablesortFirst'
  requirements:
    _access: 'TRUE'

database_test.tablesort_default_sort:
  path: '/database_test/tablesort_default_sort'
  defaults:
    _form: '\Drupal\database_test\Form\Database_Test_Form'
  requirements:
    _access: 'TRUE'
