system.401:
  path: '/system/401'
  defaults:
    _controller: '\Drupal\system\Controller\Http4xx_Controller:on401'
    _title: 'Unauthorized'
  requirements:
    _access: 'TRUE'

system.403:
  path: '/system/403'
  defaults:
    _controller: '\Drupal\system\Controller\Http4xx_Controller:on403'
    _title: 'Access denied'
  requirements:
    _access: 'TRUE'

system.404:
  path: '/system/404'
  defaults:
    _controller: '\Drupal\system\Controller\Http4xx_Controller:on404'
    _title: 'Page not found'
  requirements:
    _access: 'TRUE'

system.4xx:
  path: '/system/4xx'
  defaults:
    _controller: '\Drupal\system\Controller\Http4xx_Controller:on4xx'
    _title: 'Client error'
  requirements:
    _access: 'TRUE'

system.admin:
  path: '/admin'
  defaults:
    _controller: '\Drupal\system\Controller\System_Controller::systemAdminMenuBlockPage'
    _title: 'Administration'
  requirements:
    _permission: 'access administration pages'

system.admin_structure:
  path: '/admin/structure'
  defaults:
    _controller: '\Drupal\system\Controller\System_Controller::systemAdminMenuBlockPage'
    _title: 'Structure'
  requirements:
