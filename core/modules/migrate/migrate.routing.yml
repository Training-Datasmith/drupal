migrate.messages:
  path: '/admin/reports/migration-messages'
  defaults:
    _controller: '\Drupal\migrate\Controller\Migrate_Message_Controller::overview'
    _title: 'Migration messages'
  requirements:
    _permission: 'view migration messages'

migrate.messages.detail:
  path: '/admin/reports/migration-messages/{migration_id}'
  defaults:
    _controller: '\Drupal\migrate\Controller\Migrate_Message_Controller::details'
    _title_callback: '\Drupal\migrate\Controller\Migrate_Message_Controller::title'
  requirements:
    _permission: 'view migration messages'
