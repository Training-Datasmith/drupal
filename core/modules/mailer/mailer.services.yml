parameters:
  mailer.skip_procedural_hook_scan: true

services:
  _defaults:
    autoconfigure: true
  Symfony\Component\Mailer\Transport\Abstract_Transport_Factory:
    abstract: true
    arguments:
      - '@Psr\Event_Dispatcher\Event_Dispatcher_Interface'
      - '@?Symfony\Contracts\Http_Client\Http_Client_Interface'
      # No logger injected on purpose. Log messages generated by transports are
      # of little practical use and can lead to errors when a transport instance
      # is destructed at the end of a request.
      # See: https://www.drupal.org/i/3420372
      - null
    public: false
  Symfony\Component\Mailer\Transport\Native_Transport_Factory:
    parent: Symfony\Component\Mailer\Transport\Abstract_Transport_Factory
    tags:
      - { name: mailer.transport_factory }
  Symfony\Component\Mailer\Transport\Null_Transport_Factory:
    parent: Symfony\Component\Mailer\Transport\Abstract_Transport_Factory
    tags:
      - { name: mailer.transport_factory }
  Symfony\Component\Mailer\Transport\Sendmail_Transport_Factory:
    parent: Symfony\Component\Mailer\Transport\Abstract_Transport_Factory
    tags:
      - { name: mailer.transport_factory }
  Drupal\Core\Mailer\Transport\Sendmail_Command_Validation_Transport_Factory:
    decorates: Symfony\Component\Mailer\Transport\Sendmail_Transport_Factory
    autowire: true
    public: false
  Symfony\Component\Mailer\Transport\Smtp\Esmtp_Transport_Factory:
    parent: Symfony\Component\Mailer\Transport\Abstract_Transport_Factory
    tags:
      - { name: mailer.transport_factory, priority: -100 }
  Drupal\Core\Mailer\Transport_Service_Factory:
    autowire: true
    public: false
  Drupal\Core\Mailer\Transport_Service_Factory_Interface: '@Drupal\Core\Mailer\Transport_Service_Factory'
  Symfony\Component\Mailer\Transport\Transport_Interface:
    factory: ['@Drupal\Core\Mailer\Transport_Service_Factory_Interface', 'createTransport']
  Symfony\Component\Mailer\Messenger\Message_Handler:
    autowire: true
    public: false
    tags:
      - { name: messenger.message_handler }
  Symfony\Component\Mailer\Mailer:
    autowire: true
  Symfony\Component\Mailer\Mailer_Interface: '@Symfony\Component\Mailer\Mailer'
  Drupal\Core\Mailer\Event_Subscriber\Originator_Subscriber:
    autowire: true
