user_language_test.post_response:
  path: '/user-language-test/post'
  defaults:
    _controller: Drupal\user_language_test\Controller\User_Language_Test_Controller::buildPostResponse
  methods: [post]
  options:
    _admin_route: TRUE
  requirements:
    _access: 'TRUE'

user_language_test.form:
  path: '/user-language-test/form'
  defaults:
    _form: 'Drupal\user_language_test\Form\User_Language_Test_Form'
  requirements:
    _access: 'TRUE'
