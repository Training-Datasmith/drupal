help.main:
  path: '/admin/help'
  defaults:
    _controller: '\Drupal\help\Controller\Help_Controller::helpMain'
    _title: 'Help'
  requirements:
    _permission: 'access help pages'

help.page:
  path: '/admin/help/{name}'
  defaults:
    _controller: '\Drupal\help\Controller\Help_Controller::helpPage'
    _title: 'Help'
  requirements:
    _permission: 'access help pages'

help.help_topic:
  path: '/admin/help/topic/{id}'
  defaults:
    _controller: '\Drupal\help\Controller\Help_Topic_Plugin_Controller::viewHelpTopic'
  requirements:
    _permission: 'access help pages'
