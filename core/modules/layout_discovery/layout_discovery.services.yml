parameters:
  layout_discovery.skip_procedural_hook_scan: true

services:
  _defaults:
    autoconfigure: true
  plugin.manager.core.layout:
    class: Drupal\Core\Layout\Layout_Plugin_Manager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@theme_handler']
  Drupal\Core\Layout\Layout_Plugin_Manager_Interface: '@plugin.manager.core.layout'
  layout.icon_builder:
    class: Drupal\Core\Layout\Icon\Svg_Icon_Builder
    shared: false
  Drupal\Core\Layout\Icon\Icon_Builder_Interface: '@layout.icon_builder'
