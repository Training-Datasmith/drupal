parameters:
  page_cache.skip_procedural_hook_scan: true

services:
  _defaults:
    autoconfigure: true
  http_middleware.page_cache:
    class: Drupal\page_cache\Stack_Middleware\Page_Cache
    arguments: ['@cache.page', '@page_cache_request_policy', '@page_cache_response_policy']
    tags:
      - { name: http_middleware, priority: 200 }

  cache.page:
    class: Drupal\Core\Cache\Cache_Backend_Interface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [page]
